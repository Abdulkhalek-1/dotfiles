# ============================================================
#  Hyprland — main config (sources focused sub-files)
# ============================================================
source = ~/.config/hypr/mocha.conf

# ---- Monitors -------------------------------------------------
monitor = eDP-1, preferred, auto, 1

# ---- Programs -------------------------------------------------
$terminal    = ghostty
$fileManager = nautilus
$browser     = xdg-open https://
$menu        = wofi --show drun
$mainMod     = SUPER

source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/rules.conf

# ---- Environment ---------------------------------------------
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,catppuccin-mocha-dark-cursors
env = QT_QPA_PLATFORMTHEME,qt5ct

xwayland {
    force_zero_scaling = true
}

# ---- Input / laptop -----------------------------------------
input {
    kb_layout  = us,eg
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll = no
        tap-to-click   = yes
        disable_while_typing = yes
    }
}

# 3-finger horizontal swipe to change workspaces
# (Hyprland 0.55: new `gesture` keyword replaces the old gestures{} block)
gesture = 3, horizontal, workspace

# ---- Look & feel --------------------------------------------
general {
    border_size = 3
    col.active_border   = $mauve $flamingo 90deg
    col.inactive_border = $surface0
    resize_on_border = true
    gaps_in  = 4
    gaps_out = 8
    layout   = dwindle
    allow_tearing = false
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size    = 4
        passes  = 2
    }
    shadow {
        enabled = true
        range   = 4
        render_power = 3
        color   = rgba(1a1a1aee)
    }
}

animations {
    enabled = true
    bezier  = ease, 0.25, 0.1, 0.25, 1.0
    animation = windows,    1, 4, ease, slide
    animation = fade,       1, 4, ease
    animation = workspaces, 1, 5, ease, slide
    animation = border,     1, 8, ease
}

dwindle {
    preserve_split = yes
}

# ---- Window groups (tabbed windows) -------------------------
group {
    col.border_active        = $mauve $flamingo 45deg
    col.border_inactive      = $surface0
    col.border_locked_active = $red $peach 45deg

    groupbar {
        enabled          = true
        font_family      = JetBrainsMono Nerd Font
        font_size        = 11
        height           = 18
        indicator_height = 3
        gradients        = true
        rounding         = 6
        text_color       = $text
        col.active       = $mauve
        col.inactive     = $surface0
        col.locked_active = $red
    }
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
}