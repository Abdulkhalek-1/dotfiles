# ============================================================
#  Window & layer rules
# ============================================================

# Suppress maximize events apps sometimes send
windowrule = suppress_event maximize class:.*

# clipse clipboard: floating, centered, sized
windowrule = float       class:(clipse)
windowrule = size 760 520 class:(clipse)
windowrule = center      class:(clipse)

# flameshot: float its GUI, no blur
windowrule = float   class:(flameshot)
windowrule = no_blur class:(flameshot)

# Picture-in-picture floats and stays pinned
windowrule = float title:(Picture-in-Picture)
windowrule = pin   title:(Picture-in-Picture)

# Smooth wofi (no layer animation)
layerrule = no_anim wofi