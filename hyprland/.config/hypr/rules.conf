# ============================================================
#  Window & layer rules
#  NOTE: Hyprland 0.55 changed the rule syntax. Format is now:
#    windowrule = match:class (REGEX), effect value, effect value
#  - matching is a FULL-STRING regex (anchored) -> wrap with .* for substring
#  - boolean effects take a value: `float on`, `pin on`, `no_blur on`
#  - the old `windowrulev2` keyword and comma `float, class:(x)` form are removed
# ============================================================

# Suppress maximize events apps sometimes send
windowrule = match:class (.*), suppress_event maximize

# clipse clipboard: floating, centered, sized (launched with class clipse.clipboard)
windowrule = match:class (.*clipse.*), float on, center on, size 760 520

# flameshot: float its GUI, no blur, no slide-in animation
windowrule = match:class (.*flameshot.*), float on, no_blur on, no_anim on

# Picture-in-picture floats and stays pinned
windowrule = match:title (.*Picture-in-Picture.*), float on, pin on

# Smooth wofi (no layer animation)
layerrule = no_anim wofi