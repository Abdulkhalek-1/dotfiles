# ============================================================
#  Autostart
# ============================================================
# Export Wayland session env to dbus/systemd so portals (screenshare,
# file pickers), keyring, and notifications work reliably.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

exec-once = hyprctl setcursor catppuccin-mocha-dark-cursors 24
exec-once = systemctl --user start hyprpolkitagent

# Bar + system controls + notifications (replaces waybar + swaync)
exec-once = hyprpanel

# Wallpaper, idle daemon
exec-once = hyprpaper
exec-once = hypridle

# Clipboard: cursor-clip daemon (monitors + persists history, text + images)
exec-once = cursor-clip --daemon

# Network / power applets handled by HyprPanel; nothing else needed here